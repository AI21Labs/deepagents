[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-teel"
description = "Sandboxed Python REPL middleware for deepagents, running CPython in WebAssembly with Teel lookahead"
license = { text = "MIT" }
readme = "README.md"

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

version = "0.0.1"
requires-python = ">=3.11,<4.0"
keywords = ["deepagents", "langchain", "langgraph", "repl", "python", "wasm", "teel", "middleware"]

dependencies = [
    "deepagents>=0.7.0,<0.8.0",
    "langchain>=1.4.2,<2.0.0",
    "langchain-core>=1.6.4,<2.0.0",
    "langgraph>=1.2.12,<2.0.0",
    "wasmtime>=49.0.0,<50.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["langchain_teel"]

[project.urls]
Homepage = "https://github.com/langchain-ai/deepagents/tree/main/libs/partners/teel"
Repository = "https://github.com/langchain-ai/deepagents"
Documentation = "https://github.com/langchain-ai/deepagents/tree/main/libs/partners/teel"

[dependency-groups]
lint = [
    "ruff>=0.15.20,<0.16.0",
    "ty>=0.0.54,<1.0.0",
]

[tool.uv.sources]
deepagents = { path = "../../deepagents", editable = true }

[tool.ty.environment]
python-version = "3.11"
extra-paths = ["../../deepagents"]

[tool.ty.src]
# Runs inside the wasm guest, which ships teel in its site-packages.
exclude = ["langchain_teel/_guest"]

[tool.ty.rules]
# https://docs.astral.sh/ty/rules/
division-by-zero = "error"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # Messes with the formatter
    "ISC001",  # Messes with the formatter
    "ANN401",  # Dynamically typed expressions (typing.Any) are disallowed — too strict for generic wrappers
    "PLR0911",  # Too many return statements — branchy marshalers (JSON schema → type names) are intentionally flat
    "PLR0913",  # Too many arguments — middleware constructors legitimately expose many knobs
]
extend-safe-fixes = ["PLR6201"]

[tool.ruff.lint.pydocstyle]
convention = "google"
ignore-var-parameters = true  # ignore missing documentation for *args and **kwargs parameters

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.extend-per-file-ignores]
# Guest code runs inside the wasm sandbox; executing model code there is its job.
"langchain_teel/_guest/*.py" = ["S102", "S307", "INP001", "BLE001"]
